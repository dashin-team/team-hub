name: 發布 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 取出程式
        uses: actions/checkout@v4

      - name: 整理靜態網站
        run: |
          mkdir -p _site/css _site/js
          cp index.html favicon.svg .nojekyll _site/
          cp css/styles.css _site/css/
          cp js/*.js _site/js/

      - name: 設定 Pages
        uses: actions/configure-pages@v5

      - name: 上傳網站檔案
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
